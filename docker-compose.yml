services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: toefl
      POSTGRES_PASSWORD: toefl
      POSTGRES_DB: toefl
    ports:
      - '5432:5432'
    volumes:
      - toefl_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U toefl -d toefl']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toefl_pg:
